/* V2 — simple study-first layout: no levels, XP, or quests */
.intro-strip{display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(120deg,#152842,#132139);border:1px solid #324865;border-radius:20px;padding:25px 31px}
.intro-strip h1{font-size:clamp(25px,3.5vw,36px);letter-spacing:-.04em;line-height:1.28;margin:9px 0 9px}
.intro-strip p{margin:0;color:#b0c2da;font-size:13px;line-height:1.65}
.intro-counter{border-left:1px solid #3b5370;padding-left:25px;display:flex;flex-direction:column;align-items:center;min-width:96px;flex-shrink:0}
.intro-counter strong{font-size:36px;font-weight:900;line-height:1;color:#86eef2}
.intro-counter span{font-size:11px;color:#b0c2da;margin-top:9px}
.top-help{font-size:12px;color:#94bad1}
.settings-grid{grid-template-columns:minmax(0,1.4fr) minmax(310px,.9fr);margin-top:17px}
.difficulty-row{grid-template-columns:repeat(4,minmax(0,1fr))}
.difficulty-btn{font-size:11px;min-width:0}
.difficulty-help{margin:10px 0 5px;min-height:3.3em;color:#b7cbe1;font-size:12px;line-height:1.65}
.below-note{font-size:11px;color:#879bb7;margin:17px 5px;line-height:1.8}
.stats-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats-3 .stat{padding:12px 9px}
.stats-3 .stat-num{font-size:23px}
.stats-3 .stat-label{font-size:10px}
.result-2{grid-template-columns:repeat(2,1fr);max-width:560px}
.result-rank{letter-spacing:.06em;color:#a3e8ed}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#243e51;color:#fff;border:1px solid #65c3d8;padding:13px 19px;border-radius:12px;z-index:50;max-width:95vw;box-shadow:0 12px 30px #0008}
@media(max-width:1030px){.settings-grid{grid-template-columns:1fr}}
@media(max-width:650px){.intro-strip{padding:22px 18px;border-radius:16px}.intro-strip h1{font-size:26px}.intro-strip p{font-size:12px}.intro-counter{display:none}.top-help{display:none}.stats-3{grid-template-columns:repeat(3,minmax(0,1fr))}.difficulty-btn{font-size:10px;padding:12px 2px}}

.resume-banner{display:flex;gap:15px;align-items:center;justify-content:space-between;margin-top:17px;border:1px solid #5c8597;border-radius:14px;padding:15px 19px;background:#1c3544}

.extended-option small{font-size:11px;color:#bdcce0;display:block;margin-top:5px;line-height:1.65}

<script>/* Physics Quest Arena - question engine. No network or dependencies. */
(function (global) {
  'use strict';
  const TOPICS = [
    {id:'water', name:'水圧', icon:'💧', color:'#56d2f6', sub:'深さ・水圧・圧力'},
    {id:'vectors', name:'力の合成と分解', icon:'↗', color:'#ad95ff', sub:'合力・向き・成分'},
    {id:'forceMotion', name:'運動と力のはたらき', icon:'⚡', color:'#f7b86b', sub:'合力と運動の変化'},
    {id:'horizontal', name:'水平面上の運動', icon:'→', color:'#62dab3', sub:'速さ・等速直線運動'},
    {id:'incline', name:'斜面上の運動', icon:'◢', color:'#ef90aa', sub:'斜面方向の力'},
    {id:'reaction', name:'作用・反作用', icon:'⇄', color:'#92b5ff', sub:'2物体に働く力'},
    {id:'work', name:'仕事', icon:'▣', color:'#ffd27c', sub:'力と移動距離'},
    {id:'kinetic', name:'運動エネルギー', icon:'◉', color:'#f89a8d', sub:'質量と速さ'},
    {id:'potential', name:'位置エネルギー', icon:'↑', color:'#9fd0ad', sub:'高さと重力'},
    {id:'mechanical', name:'力学的エネルギー', icon:'✦', color:'#c69bf1', sub:'エネルギーの保存'},
  ];
  const REG = [];
  // 数式が中学校の通常学習から外れる場合は、本人が明示的にオンにしたときのみ出題。
  const EXTENDED_IDS = new Set(['water_depth','water_find_depth','water_area','vec_orthogonal','k_speed_ratio','k_formula','k_compare']);
  function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function pick(a){return a[ri(0,a.length-1)];}
  function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=ri(0,i);[x[i],x[j]]=[x[j],x[i]];}return x;}
  function fmt(v){return Number.isInteger(v)?String(v):String(Number(v.toFixed(5)));}
  function add(topic, id, level, generator){REG.push({topic,id,level,generator,extended:EXTENDED_IDS.has(id)});}
  function diagram(name, labels=[]){return {src:'assets/diagrams/'+name+'.png', labels:labels.map((text,i)=>({text:String(text),x:82,y:25+i*19}))};}
  function qBase(kind,prompt,scene,explanation,hint){return {kind,prompt,diagram:scene,explanation,hint};}
  function choice(prompt,scene,correct,wrong,unit,explanation,hint){
    const display=v=>fmt(v)+(unit?' '+unit:'');
    const raw=[correct,...wrong.filter(v=>Math.abs(v-correct)>1e-9)];
    const uniq=[...new Set(raw.map(display))];
    let n=1;
    while(uniq.length<4){const v=correct+(((n%2)?1:-1)*Math.ceil(n/2)*(Math.abs(correct)>10?10:1));if(v>=0&&!uniq.includes(display(v)))uniq.push(display(v));n++;}
    const opts=shuffle(uniq.slice(0,4));
    return {...qBase('single',prompt,scene,explanation,hint),options:opts,answers:[opts.indexOf(display(correct))]};
  }
  function textChoice(prompt,scene,correct,wrong,explanation,hint){
    const opts=shuffle([correct,...wrong]);
    return {...qBase('single',prompt,scene,explanation,hint),options:opts,answers:[opts.indexOf(correct)]};
  }
  function multi(prompt,scene,entries,explanation,hint){
    const opts=shuffle(entries.map(([text,yes])=>({text,yes})));
    return {...qBase('multi',prompt,scene,explanation,hint),options:opts.map(x=>x.text),answers:opts.flatMap((x,i)=>x.yes?[i]:[])};
  }
  function number(prompt,scene,answer,unit,explanation,hint){
    return {...qBase('number',prompt,scene,explanation,hint),answer,unit};
  }
  function templatesFor(topics,mode,includeExtended=false){
    const levels = mode === 'basic'?[1]:mode==='standard'?[1,2]:mode==='challenge'?[2,3]:[1,2,3];
    return REG.filter(t=>topics.includes(t.topic)&&levels.includes(t.level)&&(includeExtended||!t.extended));
  }
  function makeSession(topics,count,mode='mix',review=[],includeExtended=false){
    if (review && review.length) return shuffle(review).slice(0,count).map((item,i)=>({...item,uid:'review-'+i+'-'+Date.now()}));
    const pool=templatesFor(topics,mode,includeExtended);
    if(!pool.length) throw new Error('選択できる問題がありません。');
    const grouped = topics.map(topic=>pool.filter(t=>t.topic===topic)).filter(g=>g.length);
    const all=[],seen=new Set();let lastId='';
    for(let i=0;i<count;i++){
      const group=grouped[i%grouped.length];
      let result=null;
      for(let tries=0;tries<140;tries++){
        const possible=tries<6?group.filter(t=>t.id!==lastId):group;
        const temp=pick(possible.length?possible:group);
        const candidate=temp.generator();
        const fingerprint=temp.id+'|'+candidate.prompt+'|'+candidate.diagram.labels.map(x=>x.text).join('|');
        if(!seen.has(fingerprint)||tries===139){
          result={...candidate,topic:temp.topic,templateId:temp.id,level:temp.level,uid:'q'+i+'-'+Math.random().toString(36).slice(2,9)};
          seen.add(fingerprint);lastId=temp.id;break;
        }
      }
      all.push(result);
    }
    return shuffle(all);
  }
  function evaluate(q,answer){
    if(q.kind==='number'){
      const cleaned=String(answer).trim().replace(/[０-９．－]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/,/g,'').replace(/，/g,'');
      if(cleaned==='')return {valid:false,correct:false};
      const x=Number(cleaned);
      if(!Number.isFinite(x))return {valid:false,correct:false};
      return {valid:true,correct:Math.abs(x-q.answer)<=Math.max(0.00001,Math.abs(q.answer)*0.000001)};
    }
    const nums=Array.isArray(answer)?answer:[answer];
    if(!nums.length)return {valid:false,correct:false};
    const got=[...new Set(nums.map(Number))].sort((a,b)=>a-b), wanted=[...q.answers].sort((a,b)=>a-b);
    return {valid:true,correct:got.length===wanted.length&&got.every((v,i)=>v===wanted[i])};
  }
  function correctText(q){return q.kind==='number'?fmt(q.answer)+(q.unit?' '+q.unit:''):q.answers.map(i=>q.options[i]).join(' ／ ');}
  const api={TOPICS,REG,add,ri,pick,shuffle,fmt,diagram,choice,textChoice,multi,number,makeSession,evaluate,correctText,templatesFor};
  global.QuizCore=api;
  if(typeof module!=='undefined'&&module.exports)module.exports=api;
})(typeof window==='undefined'?globalThis:window);
</script>

(function(C){

add('water','water_depth',1,()=>{const dm=ri(2,75),p=dm*1000;return N(`水面から${fmt(dm/10)}mの深さにある点で、水圧はいくら？ 水の密度は1000kg/m³、重力加速度は10m/s²とする。`,D('water',[`水深 ${fmt(dm/10)} m`,'密度 1000 kg/m³']),p,[p/10,p*10,p+1000],'Pa',`水圧＝密度×重力加速度×深さ。1000×10×${fmt(dm/10)}＝${p}Pa。`,`深さをmにそろえ、密度と重力加速度を掛けよう。`);});
add('water','water_ratio',1,()=>{const a=ri(1,6),mul=ri(2,4),b=a*mul;return N(`同じ水槽で水面からA点は${a*10}cm、B点は${b*10}cmの深さにある。B点の水圧はA点の何倍？`,DP([`A：${a*10} cm`,`B：${b*10} cm`]),mul,[mul+1,mul-1,1/mul],'倍',`同じ液体では水圧は水面からの深さに比例。${b*10}÷${a*10}＝${mul}倍。`,'深さが何倍になったかに注目。');});
add('water','water_same_depth',1,()=>{const x=ri(3,120);return S(`同じ水中の深さ${fmt(x/10)}mの位置で、小さな面の向きを変えた。水圧の大きさについて正しいのは？`,D('water',[`深さ ${fmt(x/10)} m`,'面の向きを変える']),`向きに関係なく同じ`,[`水平な面だけ大きい`,`鉛直な面だけ大きい`,`上向きの面ではゼロ`],`水圧はあらゆる向きに働き、同じ深さでは大きさは同じ。`,`水圧の向きと大きさを区別しよう。`);});
add('water','water_find_depth',2,()=>{const d=ri(2,75),p=d*1000;return I(`水中のある点で測った水圧が${p}Pa。深さは何m？ 水の密度1000kg/m³、重力加速度10m/s²とする。`,D('water',[`水圧 ${p} Pa`]),d/10,'m',`深さ＝${p}÷(1000×10)＝${fmt(d/10)}m。`,`水圧＝密度×重力加速度×深さ を深さについて解こう。`);});
add('water','water_area',3,()=>{const k=ri(2,65),area=ri(1,25)*20,force=k*area/10;return N(`水圧が一様に${k*1000}Paの小さな平面（面積${area}cm²）に、水が垂直に及ぼす力の大きさは？`,D('water',[`水圧 ${k*1000} Pa`,`面積 ${area} cm²`]),force,[force*10,force/10,force+10],'N',`面積${area}cm²＝${fmt(area/10000)}m²。力＝圧力×面積＝${k*1000}×${fmt(area/10000)}＝${force}N。`,`cm²をm²へ直す必要がある。`);});

// 中学の通常範囲：水圧が深さに比例、同じ深さなら形・向きによらない。
add('water','water_double_concept',1,()=>{const a=ri(1,8)*10,k=pick([2,3,4]),b=a*k;return N(`同じ水の中で、水深${a}cmの水圧をPとする。水深${b}cmの水圧はPの何倍？`,DP([`深さ A ${a} cm`,`深さ B ${b} cm`]),k,[k+1,Math.max(1,k-1),k*k],'倍',`同じ液体では水圧は深さに比例する。${b}÷${a}＝${k}倍。`,'深さが何倍になったかを比べよう。');});
add('water','water_same_level',1,()=>{const depth=ri(1,90)*10;return S(`同じ水槽で、ともに水深${depth}cmにあるA点とB点の水圧を比べる。正しいのはどれ？`,D('water-levels',[`A：${depth} cm`,`B：${depth} cm`]), '同じ大きさ', ['容器の左側の方が大きい','面の向きで必ず大きさが変わる','同じ深さでも必ず異なる'], '同じ水の中なら、水圧は水面からの深さで決まる。容器の形にはよらない。','比較するときは水面からの深さに注目しよう。');});
// 教科書の比例計算として扱える、水深10cmで約1kPaのモデル問題。
add('water','water_kpa_model',2,()=>{const d=ri(1,12)*10;return N(`ある水槽では、水深10cmで水圧が1kPa増えるとする。水深${d}cmで水圧は何kPa？（水面を0kPaとする）`,D('water',[`深さ ${d} cm`,'10cm につき 1kPa']),d/10,[d,Math.max(0,d/10-1),d/10+2],'kPa',`深さ${d}cmは10cmの${d/10}倍。水圧も${d/10}倍で${d/10}kPa。`,'「深さ10cmあたり1kPa」と、深さの比を使う。');});

// 2. VECTOR COMPOSITION / RESOLUTION
add('vectors','vec_same',1,()=>{const a=ri(2,120),b=ri(2,120);return N(`右向きに${a}Nと${b}Nの力が同時にはたらく。合力の大きさは？`,D('forces-same',[`右向き ${a} N`,`右向き ${b} N`]),a+b,[Math.abs(a-b),a*b,a+b+2],'N',`同じ向きなので加える。${a}+${b}＝${a+b}N、向きは右。`,`2つの矢印が同じ向きかどうか確かめよう。`);});
add('vectors','vec_opposite',1,()=>{const a=ri(5,150),b=ri(1,a-1);return N(`右向き${a}N、左向き${b}Nの力が1つの物体にはたらく。合力の大きさは？`,D('forces',[`右 ${a} N`,`左 ${b} N`]),a-b,[a+b,a,2*b],'N',`反対向きなので大きさの差。${a}−${b}＝${a-b}N。向きは大きい力の右向き。`,`反対向きの力は差を考える。`);});
add('vectors','vec_direction',2,()=>{const x=ri(3,140),y=ri(1,x-1);return S(`1つの物体に右向き${x}Nと左向き${y}Nがはたらく。合力の向きと大きさは？`,D('forces',[`右 ${x} N`,`左 ${y} N`]),`右向き ${x-y} N`,[`左向き ${x-y} N`,`右向き ${x+y} N`,`左向き ${x+y} N`],`大きいのは右向き${x}N。差は${x-y}Nなので右向き${x-y}N。`,`大きい方の力の向きが合力の向きになる。`);});
add('vectors','vec_orthogonal',3,()=>{const [a,b,c]=pick([[3,4,5],[5,12,13],[8,15,17]]),k=ri(1,45);return N(`直角に交わる2つの力が、右向き${a*k}Nと上向き${b*k}N。合力の大きさはいくら？（発展問題）`,D('vectors',[`水平 ${a*k} N`,`鉛直 ${b*k} N`]),c*k,[a*k+b*k,Math.abs(a-b)*k,(a+b-c)*k],'N',`直角三角形の関係より √(${a*k}²＋${b*k}²)＝${c*k}N。`,`直角に交わる2力なので、単純な足し算ではない。`);});
add('vectors','vec_resolution',2,()=>{const k=ri(1,65),which=pick(['horizontal','vertical']);const val=(which==='horizontal'?3:4)*k;return N(`大きさ${5*k}Nの力を、直角の水平・鉛直成分に分解した。成分の大きさの比は「水平：鉛直＝3：4」。${which==='horizontal'?'水平':'鉛直'}成分は何N？`,D('vectors',[`元の力 ${5*k} N`,'成分比 3：4']),val,[5*k,(which==='horizontal'?4:3)*k,7*k],'N',`3：4：5の直角三角形に対応するので${which==='horizontal'?3:4}×${k}＝${val}N。`,`元の力の長さにあたるのは比の「5」。`);});

// 3. FORCE AND MOTION
add('forceMotion','motion_net',1,()=>{const push=ri(9,50),res=ri(1,push-2);return N(`台車を右へ${push}Nで押し、左へ${res}Nの抵抗がはたらく。水平方向の合力の大きさは？`,D('track',[`押す力 ${push} N`,`抵抗 ${res} N`]),push-res,[push+res,push,res],'N',`向きが逆なので合力は${push}−${res}＝${push-res}N、右向き。`,`左向きの抵抗は差し引く。`);});
add('forceMotion','motion_speedup',1,()=>{const force=ri(2,50);return S(`水平に右へ動いている台車に、右向きの合力${force}Nがはたらき続ける。速さはどう変わる？`,D('track',[`合力 → ${force} N`]),'速くなる',['遅くなる','速さは必ず一定','すぐに静止する'],`進む方向と同じ右向きの合力があるので、右向きの速さは増す。`,`力の向きと運動の向きを考えよう。`);});
add('forceMotion','motion_balanced',1,()=>{const s=ri(1,15);return S(`右向きに${s}m/sで進む台車の水平方向の合力が0になった。摩擦や空気抵抗はない。このあとどうなる？`,D('motion',[`初速度 ${s} m/s`]),`右向き${s}m/sで進み続ける`,[`すぐに停止する`,`さらに速くなり続ける`,`左向きに動きだす`],`合力0なら運動の状態は変わらず、等速直線運動をする（慣性）。`,`力が0でも、速さが0とは限らない。`);});
add('forceMotion','motion_multiple',2,()=>M(`合力が0の物体について、正しい説明をすべて選ぼう。摩擦など他の影響は考えない。`,D('motion',['合力 0 N']),[['静止したままの場合がある',true],['一定の速さで直進する場合がある',true],['必ず速度が増す',false],['一定速度の運動では向きも変わらない',true]],`合力0なら静止は静止のまま、運動中なら同じ速度で直進。速度は大きさと向きをもつ。`,`「合力が0」と「速さが0」は別の意味。`));
add('forceMotion','motion_braking',2,()=>{const r=ri(3,60);return S(`右へ進む物体に、左向き${r}Nの合力だけがはたらく。物体がまだ右へ進んでいる間、速さはどうなる？`,D('track',[`進行方向 →`,`合力 ← ${r} N`]),'小さくなる',['大きくなる','必ず変わらない','瞬間的に0になる'],`進行方向と逆向きに合力がはたらく間は、右向きの速さが減少する。`,`進行方向と逆向きの力は、運動をどう変える？`);});

// 4. HORIZONTAL MOTION
add('horizontal','h_speed',1,()=>{const v=ri(2,15),t=ri(2,50),dist=v*t;return N(`水平な道を台車が${t}秒間で${dist}m進んだ。平均の速さは何m/s？`,D('motion',[`距離 ${dist} m`,`時間 ${t} 秒`]),v,[dist,dist+t,v+t],'m/s',`平均の速さ＝移動距離÷時間＝${dist}÷${t}＝${v}m/s。`,`速さは「距離÷時間」で求める。`);});
add('horizontal','h_distance',1,()=>{const v=ri(2,15),t=ri(3,50);return I(`台車が水平面を一定の速さ${v}m/sで${t}秒進んだ。移動距離は何m？`,D('track',[`速さ ${v} m/s`,`時間 ${t} 秒`]),v*t,'m',`一定の速さなので、距離＝速さ×時間＝${v}×${t}＝${v*t}m。`,`m/sは「1秒あたり何m」かを表す。`);});
add('horizontal','h_graph',2,()=>{const v=ri(2,11),t1=ri(2,5),t2=ri(t1+1,10);return N(`等速直線運動する台車は、${t1}秒後に${v*t1}mの位置にいた。出発位置を0mとすると、${t2}秒後の位置は？`,D('motion',[`${t1} 秒 → ${v*t1} m`,`${t2} 秒 → ？ m`]),v*t2,[v*(t2-t1),v*(t1+t2),v*t1],'m',`速さ＝${v*t1}÷${t1}＝${v}m/s。${t2}秒後は${v}×${t2}＝${v*t2}m。`,`まず1秒あたりの移動距離を求めよう。`);});
add('horizontal','h_friction',2,()=>{const push=ri(3,22);return N(`水平面で箱を右向き${push}Nで押しており、箱は等速直線運動を続けている。水平方向の摩擦力は何N？`,D('forces',[`押す力 → ${push} N`,'速さは一定']),push,[0,push*2,push+5],'N',`等速直線運動では水平方向の合力は0。摩擦力は左向き${push}N。`,`等速直線運動を続けるとき合力は何N？`);});
add('horizontal','h_compare',3,()=>{const a=ri(2,8),b=a+ri(1,5),t=ri(2,8);return N(`2台の台車A・Bが同じ時間${t}秒だけ等速運動する。Aは${a}m/s、Bは${b}m/s。BがAより長く進む距離は？`,D('motion',[`A ${a} m/s`,`B ${b} m/s`,`時間 ${t} 秒`]),(b-a)*t,[(b+a)*t,(b-a)+t,b*t],'m',`距離の差＝速さの差×時間＝(${b}−${a})×${t}＝${(b-a)*t}m。`,`それぞれの移動距離を計算して差を求める。`);});

// 5. INCLINED PLANES
add('incline','i_speed',1,()=>{const n=ri(2,180);return S(`台車を高さ${n}cmの斜面の上端から静かに放した。摩擦がないとすると、下る途中の速さはどうなる？`,D('incline',[`高さ ${n} cm`]),'しだいに大きくなる',['しだいに小さくなる','ずっと0のまま','必ず一定になる'],`斜面に沿って下向きの重力の成分がはたらくため、下るほど速くなる。`,`斜面方向にはどちら向きの重力成分がある？`);});
add('incline','i_height',1,()=>{const m=ri(1,70),h=ri(2,30);return S(`質量${m}kgの物体を、異なる傾きの2つの摩擦のない斜面で、同じ高さ${h}mまで上げた。重力に逆らってした仕事は？`,D('incline',[`質量 ${m} kg`,`到達高さ ${h} m`]),'どちらの斜面でも同じ',['急な斜面の方が大きい','ゆるい斜面の方が大きい','傾きだけでは必ず決まらない'],`摩擦がないとき必要な仕事はmgh＝${m}×10×${h}＝${m*10*h}J。斜面の傾きによらない。`,`斜面で小さくできる力と、長くなる距離を考えよう。`);});
add('incline','i_force',2,()=>{const ratio=pick([2,3,4]),h=ri(1,35),len=h*ratio,m=ratio*ri(1,22),force=m*10/ratio;return N(`摩擦のない斜面で、質量${m}kgの荷物を斜面に平行な一定の力でゆっくり引き上げる。斜面の長さ${len}m、高さ${h}m。必要な力は？ ${g}`,D('incline',[`斜面 ${len} m`,`高さ ${h} m`,`質量 ${m} kg`]),force,[m*10,m*10*h,force+10],'N',`仕事の原理より F×${len}＝${m}×10×${h}。F＝${force}N。`,`摩擦がなければ、斜面上でした仕事と高さを上げた仕事は等しい。`);});
add('incline','i_component',3,()=>{const ratio=pick([2,3,5]),w=ratio*ri(3,160),h=ri(2,65),len=h*ratio;return I(`重さ${w}Nの物体をのせた摩擦のない斜面。斜面の長さ${len}m、高さ${h}m。重力の斜面に平行な成分の大きさは何N？`,D('incline',[`重さ ${w} N`,`斜面 ${len} m`,`高さ ${h} m`]),w/ratio,'N',`斜面に沿う成分＝重さ×高さ÷斜面の長さ＝${w}×${h}÷${len}＝${w/ratio}N。`,`直角三角形の辺の比に注目しよう。`);});
add('incline','i_force_concept',2,()=>M('摩擦のない斜面上の物体にはたらく力について、正しいものをすべて選ぼう。',D('incline',['摩擦なし']),[['重力には斜面に平行な成分がある',true],['傾斜があると斜面方向に加速し得る',true],['垂直抗力は斜面に垂直にはたらく',true],['物体の重力は斜面に平行にしか働かない',false]],`重力自体は鉛直下向きで、斜面に平行・垂直な成分に分解できる。`,`重力そのものの向きと、分解した成分の向きを区別。`));

// 6. ACTION / REACTION
add('reaction','r_wall',1,()=>{const f=ri(4,260);return N(`人が壁を右向きに${f}Nの力で押した。壁が人を押し返す力の大きさは？`,D('contact',[`人 → 壁 ${f} N`]),f,[0,2*f,Math.max(1,f-2)],'N',`作用・反作用は別々の物体にはたらき、大きさが等しく向きが反対。壁から人へ${f}N。`,`「力の大きさは等しい」という法則を思い出そう。`);});
add('reaction','r_pair',1,()=>{const f=ri(3,250);return S(`人が床を下向きに${f}Nで押したとき、その反作用はどれ？`,D('floor-contact',[`人 → 床 ${f} N`]),`床が人を上向きに${f}Nで押す`,[`床が人を下向きに${f}Nで押す`,`地球が人を下向きに${f}Nで引く`,`人が床を上向きに${f}Nで引く`],`床が人を上向きに${f}Nで押す力が反作用。作用・反作用は異なる物体に作用する。`,`力を及ぼす側と受ける側を逆にしよう。`);});
add('reaction','r_identify',2,()=>M('作用・反作用の説明として正しいものをすべて選ぼう。',D('contact',['作用 ↔ 反作用']),[['同じ大きさで、互いに反対向き',true],['異なる2つの物体に働く',true],['同時に生じる',true],['1つの物体に働いてつり合う',false]],`作用と反作用は異なる物体にはたらくので、1つの物体の力のつり合いとは異なる。`,`一対の力は「誰が誰を押すか」で考えよう。`));
add('reaction','r_collision',2,()=>{const f=ri(10,350);return S(`重い台車Aと軽い台車Bが衝突した。衝突中、AがBを${f}Nで押している瞬間、BがAを押す力は？`,D('carts-contact',[`A → B ${f} N`]),`反対向きに${f}N`,[`同じ向きに${f}N`,`軽い台車なので${fmt(f/2)}N`,`重い台車なので${f*2}N`],`重さが異なっても衝突時の作用・反作用は同じ大きさで反対向き。`,`どちらが重いかで作用・反作用の大きさは変わる？`);});

// 7. WORK
add('work','w_basic',1,()=>{const f=ri(3,30),d=ri(2,14);return N(`物体を移動方向に平行な一定の力${f}Nで押し、${d}m動かした。力がした仕事は？`,D('track',[`力 ${f} N`,`移動 ${d} m`]),f*d,[f+d,f*d*10,f],'J',`仕事＝移動方向の力×移動距離＝${f}×${d}＝${f*d}J。`,`仕事の単位はJ。Nとmを使って計算する。`);});
add('work','w_no_move',1,()=>{const f=ri(10,80),t=ri(3,30);return N(`${f}Nの力で動かない壁を${t}秒押し続けた。壁に対してした力学的な仕事は？`,D('contact',[`押す力 ${f} N`,`時間 ${t} 秒`]),0,[f,f*t,t],'J',`壁の移動距離は0m。力学的な仕事は${f}×0＝0J（疲労とは別）。`,`仕事の計算に必要なのは、力に加えて何だろう？`);});
add('work','w_lift',2,()=>{const mass=ri(1,9),h=ri(1,9),ans=mass*10*h;return I(`質量${mass}kgの荷物を、一定の速さで鉛直上向きに${h}m持ち上げた。人が荷物にした仕事は何J？ ${g}`,D('lift',[`質量 ${mass} kg`,`高さ ${h} m`]),ans,'J',`必要な上向きの力は${mass}×10＝${mass*10}N。仕事＝${mass*10}×${h}＝${ans}J。`,`まず持ち上げるための力（重さ）を求めよう。`);});
add('work','w_pulley',3,()=>{const mass=ri(2,8),h=ri(1,5),ans=mass*10*h;return N(`摩擦などがない理想的な動滑車を使い、質量${mass}kgの荷物を${h}m持ち上げた。人がひもを引いてした仕事は？ ${g}`,D('pulley',[`質量 ${mass} kg`,`上昇 ${h} m`]),ans,[ans/2,ans*2,mass*10],'J',`動滑車では引く力は半分、ひもを引く距離は2倍。仕事は${mass}×10×${h}＝${ans}Jで変わらない。`,`道具を使っても仕事の総量は小さくならない（理想条件）。`);});
add('work','w_direction',2,()=>{const f=ri(3,20),d=ri(2,10);return S(`水平方向に${d}m動く物体に、真上向きに${f}Nの力がはたらく。この上向きの力がした仕事はいくら？`,D('motion',[`移動 → ${d} m`,`力 ↑ ${f} N`]),'0 J',[`${f*d} J`,`${f+d} J`,`${f} J`],`力の向きが移動方向と直角なので、移動方向の力成分は0。仕事は0J。`,`仕事では力の移動方向成分を用いる。`);});

// 授業で扱う仕事率（仕事÷時間）と身近な例を追加。
add('work','w_power',2,()=>{const sec=ri(2,12),rate=ri(2,40),w=sec*rate;return N(`ある機械が${sec}秒間で${w}Jの仕事をした。仕事率は何W？`,D('lift',[`仕事 ${w} J`,`時間 ${sec} 秒`]),rate,[w,sec+w,rate*sec],'W',`仕事率＝仕事÷時間＝${w}÷${sec}＝${rate}W。1Wは1秒間に1Jの仕事をする割合。`,'仕事の大きさを、かかった時間で割ってみよう。');});
add('horizontal','h_record_tape',2,()=>{const a=ri(1,7),b=a+ri(1,7);return S(`記録タイマーで同じ時間ごとにテープを切った。後の区間${b}cmは前の区間${a}cmより長い。運動についていえるのは？`,D('tape',[`前 ${a} cm`,`後 ${b} cm`]),'速さが大きくなっている',['速さが小さくなっている','速さは変わらない','移動方向を必ず変えた'],`同じ時間に進んだ距離が${a}cmから${b}cmに増えたので、速さは大きくなっている。`,'同じ時間の移動距離と速さの関係を考えよう。');});
add('incline','i_slope_compare',2,()=>{const a=ri(10,30),b=a+ri(7,25);return S(`同じ台車を摩擦のない2つの斜面で静かに放した。斜面Aは${a}°、Bは${b}°。斜面に平行な重力の成分が大きいのはどちら？`,D('two-slopes',[`A：${a}°`,`B：${b}°`]), '斜面B', ['斜面A','どちらも必ず0','どちらも同じ'], '斜面の角度が大きい方が、斜面方向の重力成分が大きく、速さの増え方も大きい。','急な斜面ほど下へ滑ろうとする力がどう変わるか考えよう。');});
add('reaction','r_swimming',1,()=>{const force=ri(5,60);return S(`水泳で手が水を後ろ向きに${force}Nで押した。水が手を押す反作用の向きは？`,D('swim',[`水を押す力：${force} N`]), '前向き', ['後ろ向き','真下向き','反作用はない'], '水を後ろに押すと、水は手を前向きに押し返す。作用と反作用は別々の物体に働く。','押した向きと反対方向を考えよう。');});

// 8. KINETIC ENERGY
add('kinetic','k_speed_ratio',1,()=>{const mul=pick([2,3,4]),m=ri(1,65),v=ri(1,10);return N(`質量${m}kgの物体の速さを${v}m/sから${v*mul}m/sへ変えた。運動エネルギーは何倍になる？`,D('ball',[`質量 ${m} kg`,`速さ ${v} → ${v*mul} m/s`]),mul*mul,[mul,mul*2,mul+1],'倍',`運動エネルギーは速さの2乗に比例。${mul}²＝${mul*mul}倍。`,`速さと運動エネルギーの関係は、単なる比例ではない。`);});
add('kinetic','k_mass_ratio',1,()=>{const mul=pick([2,3,4,5]),m=ri(1,65),v=ri(1,10);return N(`速さ${v}m/sの物体の質量を${m}kgから${m*mul}kgに増やした。運動エネルギーは何倍になる？`,D('ball',[`速さ ${v} m/s`,`質量 ${m} → ${m*mul} kg`]),mul,[mul*mul,mul+1,Math.max(1,mul-1)],'倍',`運動エネルギーは質量に比例するので${mul}倍。`,`質量と速さではエネルギーへの影響の仕方が違う。`);});
add('kinetic','k_factors',2,()=>M('運動エネルギーについて、正しい説明をすべて選ぼう。',D('ball',['動く物体']),[['同じ速さなら質量が大きいほど大きい',true],['同じ質量なら速さが大きいほど大きい',true],['速さが0なら運動エネルギーは0',true],['地面から高いほど必ず大きい',false]],`運動エネルギーは質量と速さに依存し、高さだけでは決まらない。`,`「運動」と「位置」のエネルギーを区別しよう。`));
add('kinetic','k_formula',3,()=>{const m=2*ri(1,100),v=ri(2,45),ans=m*v*v/2;return I(`質量${m}kg、速さ${v}m/sの物体の運動エネルギーは何J？（発展：E＝½mv²）`,D('ball',[`質量 ${m} kg`,`速さ ${v} m/s`]),ans,'J',`E＝½×${m}×${v}²＝${ans}J。速さの2乗を忘れない。`,`速さを2乗し、質量と掛けて2で割ろう。`);});
add('kinetic','k_compare',3,()=>{const m=ri(1,120),v=ri(2,58);return N(`Aは質量${2*m}kg・速さ${v}m/s、Bは質量${m}kg・速さ${v*2}m/s。Bの運動エネルギーはAの何倍？（発展）`,D('ball',[`A ${2*m} kg / ${v} m/s`,`B ${m} kg / ${v*2} m/s`]),2,[4,1,0.5],'倍',`A＝½×${2*m}×${v}²＝${m*v*v}J、B＝½×${m}×${v*2}²＝${2*m*v*v}J。BはAの2倍。`,`運動エネルギーの比を質量比と速さの2乗比から考える。`);});

// 9. POTENTIAL ENERGY
add('potential','p_formula',2,()=>{const m=ri(1,12),h=ri(1,12),ans=m*10*h;return N(`質量${m}kgの物体を地面から高さ${h}mに置いた。地面を基準とした重力による位置エネルギーは？ ${g}`,D('lift',[`質量 ${m} kg`,`高さ ${h} m`]),ans,[m*h,ans*10,m*10+h],'J',`位置エネルギー＝重さ×高さ＝${m}×10×${h}＝${ans}J。`,`重さ（N）と高さ（m）を掛ける。`);});
add('potential','p_height',1,()=>{const ratio=ri(2,12),h=ri(1,30);return N(`同じ物体を基準面から${h}mから${h*ratio}mへ持ち上げた。位置エネルギーは何倍？`,D('lift',[`最初 ${h} m`,`あと ${h*ratio} m`]),ratio,[ratio*ratio,ratio+1,ratio-1],'倍',`同じ物体なら位置エネルギーは高さに比例。${h*ratio}÷${h}＝${ratio}倍。`,`同じ質量なら高さだけ比較しよう。`);});
add('potential','p_mass',1,()=>{const mul=ri(2,9),m=ri(1,35),h=ri(1,30);return N(`高さ${h}mにある物体の質量を${m}kgから${m*mul}kgに増やすと、重力による位置エネルギーは何倍？`,D('lift',[`高さ ${h} m`,`質量 ${m} → ${m*mul} kg`]),mul,[mul*mul,mul+1,1],'倍',`位置エネルギーは質量に比例。高さが同じなら${mul}倍。`,`位置エネルギーは質量と高さに比例する。`);});
add('potential','p_reference',2,()=>{const h=ri(2,12);return S(`床を高さ0mの基準としたとき、床に置いた物体の重力による位置エネルギーは？（天井までの高さは${h}m）`,D('lift',[`床 = 基準面 0 m`]),'0 J',[`${h} J`,`${10*h} J`,'物体が重ければ必ず正'],`重力による位置エネルギーは選んだ基準面で0Jになる。`,`高さ0mの位置では「重さ×高さ」はどうなる？`);});
add('potential','p_difference',3,()=>{const m=ri(1,8),h1=ri(1,5),h2=h1+ri(1,7);return I(`質量${m}kgの物体を高さ${h1}mから${h2}mに持ち上げた。重力による位置エネルギーの増加量は何J？ ${g}`,D('lift',[`質量 ${m} kg`,`最初 ${h1} m`,`あと ${h2} m`]),m*10*(h2-h1),'J',`増加量＝${m}×10×(${h2}−${h1})＝${m*10*(h2-h1)}J。`,`高さの増加分だけを使って計算する。`);});

// 10. MECHANICAL ENERGY
add('mechanical','m_total',1,()=>{const ep=ri(2,45)*10,ek=ri(1,44)*10;return N(`ある瞬間の物体の運動エネルギーは${ek}J、位置エネルギーは${ep}J。力学的エネルギーは？`,D('energy',[`運動 ${ek} J`,`位置 ${ep} J`]),ek+ep,[Math.abs(ek-ep),ek*ep,ek+ep+10],'J',`力学的エネルギー＝運動エネルギー＋位置エネルギー＝${ek}＋${ep}＝${ek+ep}J。`,`2種類のエネルギーを合計しよう。`);});
add('mechanical','m_bottom',1,()=>{const mass=ri(1,8),h=ri(2,20),e=mass*10*h;return N(`質量${mass}kgの小球を高さ${h}mから静かに放した。摩擦・空気抵抗なしで地面の高さまで下りたとき、運動エネルギーは？ ${g}`,D('energy',[`質量 ${mass} kg`,`開始高さ ${h} m`]),e,[e/2,e*2,mass*h],'J',`開始時の位置エネルギー${mass}×10×${h}＝${e}Jが、底では運動エネルギーになる。`,`損失がなければ、位置エネルギーの減少分は何に変わる？`);});
add('mechanical','m_while',2,()=>{const e=ri(6,25)*10,ep=ri(1,e/10-1)*10;return I(`摩擦のない斜面を動く物体の力学的エネルギーは常に${e}J。ある位置で位置エネルギーが${ep}Jなら、運動エネルギーは何J？`,D('energy',[`力学的 ${e} J`,`位置 ${ep} J`]),e-ep,'J',`保存される合計${e}Jから位置エネルギー${ep}Jを引く。${e}−${ep}＝${e-ep}J。`,`合計が一定なら、一方を引けばもう一方が分かる。`);});
add('mechanical','m_friction',2,()=>M('摩擦・空気抵抗がある場合のエネルギーについて、正しいものをすべて選ぼう。',D('energy',['摩擦あり']),[['熱などへエネルギーが移り得る',true],['物体の力学的エネルギーは減る場合がある',true],['全体としてのエネルギー保存は成り立つ',true],['どんな状況でも力学的エネルギーが一定',false]],`力学的エネルギーが熱などに変わっても、全体のエネルギーは保存される。`,`「力学的エネルギー」と「エネルギー全体」は区別する。`));
add('mechanical','m_intermediate',3,()=>{const m=ri(1,6),H=ri(4,12),h=ri(1,H-1),ans=m*10*(H-h);return I(`質量${m}kgの小球を高さ${H}mから静かに放した。摩擦・空気抵抗がない。高さ${h}mの位置にきたときの運動エネルギーは何J？ ${g}`,D('energy',[`質量 ${m} kg`,`開始 ${H} m`,`途中 ${h} m`]),ans,'J',`減少した位置エネルギーが運動エネルギーになる。${m}×10×(${H}−${h})＝${ans}J。`,`開始高さから現在の高さを引いた分を考える。`);});

})(window.QuizCore);
</script>
  <script>/* 中3物理クイズ 配布版: 個人情報の登録・通信なし。 */
(function () {
  'use strict';
  const C = window.QuizCore;
  const STORAGE = 'physics-quiz-v2';
  const DRAFT_STORAGE = 'physics-quiz-draft-v3';
  const LEGACY_STORAGE = 'physics-quest-arena-v1';
  const DEFAULT = {total:0, correct:0, byTopic:{}, history:[], mistakes:[], sound:false};
  const DESCRIPTIONS = {
    basic:'基本用語・身近な例・基本的な計算を中心に出題します。',
    standard:'基本と標準を出題します。学校の授業や定期テストの復習向けです。',
    challenge:'標準と発展を出題します。考える問題や応用計算が増えます。',
    mix:'基本・標準・発展の全レベルからランダムに出題します。'
  };
  const LABELS = {basic:'基本',standard:'標準',challenge:'発展',mix:'全難易度',review:'復習','復習':'復習'};
  const $ = id => document.getElementById(id);
  const escapeHTML = x => String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const topic = id => C.TOPICS.find(t=>t.id===id) || C.TOPICS[0];
  const storageOK = (()=>{try{localStorage.setItem('__pq_probe','1');localStorage.removeItem('__pq_probe');return true;}catch(_){return false;}})();
  const settings = {topics:new Set(C.TOPICS.map(t=>t.id)),count:10,difficulty:'standard',includeExtended:false};
  let data = load();
  let session=[],index=0,answers=[],chosen=new Set(),answered=false,showHint=false,pendingNumber='',reviewMode=false,weakCurrent=[];
  let audioContext=null;

  function load(){
    if(!storageOK)return {...DEFAULT};
    try {
      const parsed=JSON.parse(localStorage.getItem(STORAGE)||localStorage.getItem(LEGACY_STORAGE)||'null');
      if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))return {...DEFAULT};
      const nonneg=n=>Number.isSafeInteger(n)&&n>=0?Math.min(n,10000000):0;
      const result={...DEFAULT,sound:parsed.sound===true,total:nonneg(parsed.total),correct:nonneg(parsed.correct)};
      result.correct=Math.min(result.correct,result.total);
      if(parsed.byTopic&&typeof parsed.byTopic==='object')for(const t of C.TOPICS){const x=parsed.byTopic[t.id];if(x){const total=nonneg(x.total);result.byTopic[t.id]={total,correct:Math.min(total,nonneg(x.correct))};}}
      const validQuestion=q=>q&&typeof q==='object'&&typeof q.prompt==='string'&&q.prompt.length<2000&&C.TOPICS.some(t=>t.id===q.topic)&&q.diagram&&typeof q.diagram.src==='string'&&/^assets\/diagrams\/[a-z-]+\.png$/.test(q.diagram.src)&&Array.isArray(q.diagram.labels)&&q.diagram.labels.length<20&&['single','multi','number'].includes(q.kind)&&typeof q.explanation==='string'&&typeof q.hint==='string';
      if(Array.isArray(parsed.mistakes))result.mistakes=parsed.mistakes.filter(validQuestion).slice(0,150);
      if(Array.isArray(parsed.history))result.history=parsed.history.filter(h=>h&&typeof h==='object'&&Array.isArray(h.topics)&&Number.isFinite(h.total)&&Number.isFinite(h.correct)&&typeof h.date==='string').slice(0,30);
      return result;
    }catch(_){return {...DEFAULT};}
  }
  function save(){if(storageOK)try{localStorage.setItem(STORAGE,JSON.stringify(data));}catch(_){}updateSound();}
  function saveDraft(){if(!storageOK||!session.length)return;try{localStorage.setItem(DRAFT_STORAGE,JSON.stringify({version:3,session,index,answers,chosen:[...chosen],answered,showHint,pendingNumber,reviewMode}));}catch(_){}}
  function readDraft(){if(!storageOK)return null;try{const d=JSON.parse(localStorage.getItem(DRAFT_STORAGE)||'null');if(d?.version!==3||!Array.isArray(d.session)||!d.session.length||d.session.length>200||!Array.isArray(d.answers)||d.answers.length>d.session.length||!Number.isInteger(d.index)||d.index<0||d.index>=d.session.length||!d.session.every(q=>q&&typeof q.prompt==='string'&&typeof q.kind==='string'&&q.diagram&&Array.isArray(q.diagram.labels)&&C.TOPICS.some(t=>t.id===q.topic)))return null;return d;}catch(_){return null;}}
  function clearDraft(){if(storageOK)try{localStorage.removeItem(DRAFT_STORAGE);}catch(_){}}
  function announce(message){const el=$('announcer');if(el)el.textContent=message;}
  function updateSound(){const b=$('soundToggle');if(!b)return;b.classList.toggle('sound-on',!!data.sound);b.setAttribute('aria-pressed',data.sound?'true':'false');b.setAttribute('aria-label',data.sound?'効果音をオフにする':'効果音をオンにする');}
  function sound(success){if(!data.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioContext ||= new AC();if(audioContext.state==='suspended')audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime;o.type='sine';o.frequency.setValueAtTime(success?600:310,t);o.frequency.exponentialRampToValueAtTime(success?780:240,t+.15);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.23);}catch(_){}}
  function showToast(message){let el=$('notice');if(!el){el=document.createElement('div');el.id='notice';el.className='toast';el.setAttribute('role','alert');document.body.appendChild(el);}el.textContent=message;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.remove(),3500);announce(message);}
  function home(){
    const pct=data.total?Math.round(data.correct/data.total*100):0;
    const draft=readDraft();
    $('app').innerHTML=`<section class="intro-strip"><div><div class="eyebrow">中学校 理科・第1分野</div><h1>中3物理の<span class="gradient-text">練習クイズ</span></h1><p>分野と問題数を選んで練習しよう。1問ずつ採点して、答えと理由を確認できます。</p></div><div class="intro-counter"><strong>10</strong><span>出題分野</span></div></section>
      ${draft?'<div class="resume-banner"><div><strong>前回の続きがあります</strong><span>途中の問題から再開できます。</span></div><button type="button" class="secondary-button" data-action="resume">続きから再開</button></div>':''}
      <div class="screen-grid settings-grid"><section class="panel"><div class="panel-title-row"><h2 class="panel-title">① 分野を選択</h2><div class="tiny-actions"><button class="link-button" type="button" data-action="all">全選択</button><button class="link-button" type="button" data-action="none">全解除</button></div></div><p class="subtitle">1分野だけでも、複数分野を組み合わせてもOK。</p><div class="topic-grid">${C.TOPICS.map(t=>`<button type="button" class="topic-toggle" data-action="topic" data-topic="${t.id}" aria-pressed="${settings.topics.has(t.id)}" style="--topic-color:${t.color};--topic-bg:${t.color}1b"><span class="topic-emoji" aria-hidden="true">${t.icon}</span><span class="topic-text"><strong>${escapeHTML(t.name)}</strong><small>${escapeHTML(t.sub)}</small></span><span class="tick" aria-hidden="true">✓</span></button>`).join('')}</div><p class="hint-line">選択中：<strong>${settings.topics.size}分野</strong>。一度に1問ずつ表示します。</p></section>
      <section class="panel"><h2 class="panel-title">② 問題の設定</h2><p class="subtitle">まずは「標準」・10問から始めるのがおすすめです。</p><div class="setting-label" id="difficultyLabel">難易度</div><div class="difficulty-row" role="group" aria-labelledby="difficultyLabel">${[['basic','基本'],['standard','標準'],['challenge','発展'],['mix','全難易度']].map(([id,text])=>`<button type="button" class="difficulty-btn" data-action="difficulty" data-difficulty="${id}" aria-pressed="${settings.difficulty===id}">${text}</button>`).join('')}</div><p class="difficulty-help" id="difficultyHelp">${DESCRIPTIONS[settings.difficulty]}</p>
      <label class="extended-option" for="extendedToggle"><input type="checkbox" id="extendedToggle" ${settings.includeExtended?'checked':''}><span><strong>中学範囲を超える数式問題も含める</strong><small>水圧の密度計算、直角方向の合力、運動エネルギーの公式など。オフなら通常の中学範囲に集中できます。</small></span></label>
      <label class="setting-label" for="countInput">問題数（1～200問）</label><div class="question-count"><button type="button" class="number-step" data-action="decrement" aria-label="1問減らす">−</button><input class="count-input" type="number" id="countInput" min="1" max="200" inputmode="numeric" value="${settings.count}"><button type="button" class="number-step" data-action="increment" aria-label="1問増やす">＋</button><span class="muted">問</span></div><div class="count-chips">${[5,10,20,30,50,100].map(n=>`<button class="count-chip ${n===settings.count?'active':''}" type="button" data-action="count-chip" data-count="${n}">${n}問</button>`).join('')}</div><button class="start-button" data-action="start" type="button">クイズを始める →</button><p class="hint-line">選択肢は選んでから「回答を決定」。数字は単位を入れずに入力します。</p>
      <div class="side-info"><h3>この端末の学習記録</h3><div class="side-stat-grid stats-3"><div class="stat"><div class="stat-num cyan">${data.total}</div><div class="stat-label">解いた問題</div></div><div class="stat"><div class="stat-num amber">${pct}%</div><div class="stat-label">累計正答率</div></div><div class="stat"><div class="stat-num">${data.mistakes.length}</div><div class="stat-label">復習候補</div></div></div><div class="side-actions"><button class="secondary-button" type="button" data-action="history">学習履歴</button><button class="secondary-button" type="button" data-action="review" ${data.mistakes.length?'':'disabled'}>復習する</button></div></div></section></div>
      <div class="home-notes"><p><strong>使い方：</strong>問題文と図の条件を確認 → 選択肢または数字で回答 → 解説を読む → 次へ。途中で閉じても、保存が使える端末なら再開できます。</p><p>${storageOK?'学習履歴はこのブラウザ内だけに保存され、外部送信されません。共有端末では使用後に履歴を削除してください。':'このブラウザでは保存機能が利用できません。回答はできますが、閉じると学習履歴は消えます。'}</p></div>`;
  }
  function setCount(n){settings.count=Math.max(1,Math.min(200,Math.trunc(Number(n))||1));home();$('countInput')?.focus();}
  function begin(review=false,onlyThis=null){
    if(!settings.topics.size){showToast('分野を1つ以上選択してください。');return;}
    const candidates=review?(onlyThis||data.mistakes).filter(q=>settings.topics.has(q.topic)):[];
    if(review&&!candidates.length){showToast('選択した分野の復習問題がありません。');return;}
    try{session=C.makeSession([...settings.topics],review?Math.min(settings.count,candidates.length):settings.count,settings.difficulty,review?candidates:null,settings.includeExtended);}catch(err){showToast(err.message);return;}
    index=0;answers=[];chosen=new Set();answered=false;showHint=false;pendingNumber='';reviewMode=review;weakCurrent=[];saveDraft();question();window.scrollTo(0,0);
  }
  function resume(){const draft=readDraft();if(!draft){showToast('再開できる問題がありません。');home();return;}session=draft.session;index=draft.index;answers=draft.answers;chosen=new Set(draft.chosen||[]);answered=!!draft.answered;showHint=!!draft.showHint;pendingNumber=String(draft.pendingNumber||'');reviewMode=!!draft.reviewMode;question();window.scrollTo(0,0);}
  function renderDiagram(q,t){
    const labels=q.diagram.labels.map(l=>escapeHTML(l.text));
    const diagramKey=q.diagram.src.match(/^assets\/diagrams\/([a-z-]+)\.png$/)?.[1];
    const source=(diagramKey&&window.__diagramAssets?.[diagramKey])||q.diagram.src;
    return `<figure class="diagram-wrap"><div class="diagram-frame"><img src="${escapeHTML(source)}" alt="${escapeHTML(t.name)}の模式図。条件は次の図の数値欄と問題文を参照。" draggable="false">${q.diagram.labels.map((l,i)=>`<span aria-hidden="true" class="diagram-label" style="left:${Number(l.x)}%;top:${Number(l.y)}%">${labels[i]}</span>`).join('')}<span class="diagram-note">模式図・縮尺は正確ではありません</span></div><figcaption class="diagram-legend"><strong>図の条件</strong>${labels.map(l=>`<span>${l}</span>`).join('')}</figcaption></figure>`;
  }
  function question(){
    const q=session[index],t=topic(q.topic),result=answers[index],isAnswered=!!result;
    answered=isAnswered;
    const correctSoFar=answers.filter(a=>a.correct).length;
    const p=Math.round((index+(isAnswered?1:0))/session.length*100);
    const kind=q.kind==='single'?'4択・1つ選択':q.kind==='multi'?'複数選択・すべて選択':'数字入力';
    const options=q.kind!=='number'?`<div class="option-grid" role="group" aria-label="回答の選択肢">${q.options.map((opt,i)=>{const selected=chosen.has(i),right=isAnswered&&q.answers.includes(i),wrong=isAnswered&&selected&&!q.answers.includes(i);return `<button type="button" class="option-button ${selected?'selected':''} ${right?'right':''} ${wrong?'wrong':''}" data-action="option" data-option="${i}" ${isAnswered?'disabled':''} aria-pressed="${selected}"><span class="option-index">${String.fromCharCode(65+i)}</span><span>${escapeHTML(opt)}</span></button>`;}).join('')}</div>`:`<div class="number-answer-row"><input type="text" id="numericAnswer" class="answer-input" inputmode="decimal" placeholder="数値を入力" autocomplete="off" spellcheck="false" aria-describedby="unitHint" ${isAnswered?'disabled':''} value="${escapeHTML(isAnswered?String(result.given):pendingNumber)}"><span class="answer-unit" id="unitHint">${escapeHTML(q.unit)}</span></div><p class="hint-line">単位は右側に表示されています。数値だけ入力してください。</p>`;
    const footer=isAnswered?`<div class="feedback ${result.correct?'good':'bad'}" id="feedback" role="status"><h3>${result.correct?'✓ 正解です':'答えを確認しよう'}</h3>${result.correct?'':`<p class="correct-answer">正解：${escapeHTML(C.correctText(q))}</p>`}<p>${escapeHTML(q.explanation)}</p></div><button class="primary-button feedback-next" data-action="next" type="button">${index===session.length-1?'結果を見る':'次の問題へ →'}</button>`:`<div class="question-actions"><button class="hint-button" type="button" data-action="hint" aria-expanded="${showHint}">${showHint?'ヒントを閉じる':'💡 ヒントを見る'}</button><button class="submit-button" type="button" data-action="submit">回答を決定する</button></div><div class="hint-box" id="hintText" ${showHint?'':'hidden'}>${escapeHTML(q.hint)}</div><p id="answerError" class="answer-error" role="alert"></p>`;
    $('app').innerHTML=`<div class="quiz-layout"><div class="play-heading"><button class="back-button" type="button" data-action="exit">← 設定に戻る</button><div class="play-quick"><span>${reviewMode?'復習':'問題'} ${index+1} / ${session.length}</span><span>正解 ${correctSoFar}問</span></div></div><div class="progress-outer" role="progressbar" aria-valuenow="${index+(isAnswered?1:0)}" aria-valuemin="0" aria-valuemax="${session.length}" aria-label="回答済み問題数"><div class="progress-inner" style="width:${p}%"></div></div><article class="question-card"><div class="question-header"><div class="question-topic"><span class="question-topic-icon" aria-hidden="true">${t.icon}</span>${escapeHTML(t.name)}</div><span class="question-type">${kind}</span></div><h2 class="prompt" id="questionTitle">Q${String(index+1).padStart(2,'0')}. ${escapeHTML(q.prompt)}</h2>${renderDiagram(q,t)}${options}${footer}</article></div>`;
    if(q.kind==='number'&&!isAnswered)$('numericAnswer')?.focus({preventScroll:true});
    announce(`${index+1}問目。${t.name}。${kind}。${isAnswered?'採点済み':''}`);
  }
  function selectOption(n){
    if(answered||!session.length)return;
    const q=session[index];if(q.kind==='number'||n<0||n>=q.options.length)return;
    if(q.kind==='single')chosen=new Set([n]);else if(chosen.has(n))chosen.delete(n);else chosen.add(n);
    document.querySelectorAll('.option-button').forEach((el,i)=>{const val=chosen.has(i);el.classList.toggle('selected',val);el.setAttribute('aria-pressed',String(val));});
    const error=$('answerError');if(error)error.textContent='';saveDraft();
  }
  function signature(q){return (q.templateId||'')+'|'+q.prompt+'|'+(q.diagram?.labels||[]).map(x=>x.text).join('|');}
  function submit(){
    if(answered||!session.length)return;
    const q=session[index],given=q.kind==='number'?($('numericAnswer')?.value??''):[...chosen];
    const evalResult=C.evaluate(q,given);
    if(!evalResult.valid){const error=$('answerError');if(error)error.textContent='選択肢を選ぶか、数値を入力してから判定してください。';announce('回答を入力してください。');return;}
    answered=true;answers[index]={correct:evalResult.correct,given,question:q};
    data.total++;if(evalResult.correct)data.correct++;
    const b=data.byTopic[q.topic]||{correct:0,total:0};b.total++;if(evalResult.correct)b.correct++;data.byTopic[q.topic]=b;
    if(!evalResult.correct){if(!data.mistakes.some(x=>signature(x)===signature(q)))data.mistakes.unshift(q);data.mistakes=data.mistakes.slice(0,150);}
    else data.mistakes=data.mistakes.filter(x=>signature(x)!==signature(q));
    save();saveDraft();sound(evalResult.correct);question();
    $('feedback')?.scrollIntoView({behavior:'instant',block:'nearest'});
    $('feedback')?.setAttribute('tabindex','-1');$('feedback')?.focus({preventScroll:true});
  }
  function next(){if(!answered)return;if(index>=session.length-1){finish();return;}index++;chosen=new Set();answered=false;showHint=false;pendingNumber='';saveDraft();question();window.scrollTo(0,0);}
  function finish(){
    const correct=answers.filter(a=>a.correct).length,total=session.length,accuracy=Math.round(100*correct/total);
    const record={date:new Date().toISOString(),topics:[...new Set(session.map(q=>q.topic))],mode:reviewMode?'review':settings.difficulty,total,correct,accuracy};
    data.history.unshift(record);data.history=data.history.slice(0,30);save();clearDraft();
    weakCurrent=answers.filter(a=>!a.correct).map(a=>a.question);
    const perTopic=[...new Set(session.map(q=>q.topic))].map(id=>{const subset=answers.filter(a=>a.question.topic===id);return `<li><span>${escapeHTML(topic(id).name)}</span><strong>${subset.filter(x=>x.correct).length} / ${subset.length}問</strong></li>`;}).join('');
    $('app').innerHTML=`<section class="result-hero" id="printArea"><div class="result-rank">学習結果</div><h1 class="result-title">${total}問おつかれさまでした</h1><p class="result-desc">答えだけでなく、考え方も確認してみましょう。</p><p class="print-name">クラス：____________　氏名：________________　実施日：____________</p><div class="result-stat-grid result-2"><div class="result-stat"><strong>${accuracy}%</strong><span>今回の正答率</span></div><div class="result-stat"><strong>${correct} / ${total}</strong><span>正解数</span></div></div><div class="result-actions no-print"><button class="primary-button" type="button" data-action="retry">もう一度解く</button><button class="secondary-button" type="button" data-action="home">分野を選び直す</button><button class="secondary-button" type="button" data-action="print">結果を印刷・PDF保存</button></div></section><section class="panel review-panel"><h3>分野別の結果</h3><ul class="topic-results">${perTopic}</ul></section><section class="panel review-panel no-print"><h3>${weakCurrent.length?'今回の間違いを確認':'全問正解です！'}</h3>${weakCurrent.length?`<div class="review-list">${weakCurrent.map(q=>`<div class="review-item"><p><b>${escapeHTML(topic(q.topic).name)}</b>：${escapeHTML(q.prompt)}</p><small>正解：${escapeHTML(C.correctText(q))}</small></div>`).join('')}</div><div class="side-actions"><button type="button" data-action="review-current" class="secondary-button">今回間違えた問題を復習</button></div>`:'<p class="muted">違う分野や難易度でも練習できます。</p>'}</section>`;
    window.scrollTo(0,0);announce(`学習終了。${total}問中${correct}問正解。`);
  }
  function history(){
    $('app').innerHTML=`<div class="quiz-layout"><div class="play-heading"><button type="button" class="back-button" data-action="home">← 設定に戻る</button><h2 class="panel-title">学習履歴</h2></div><section class="panel"><h3 class="panel-title" style="margin-bottom:18px">分野別の正答率</h3><div class="history-rows">${C.TOPICS.map(t=>{const x=data.byTopic[t.id]||{correct:0,total:0};const rate=x.total?Math.round(x.correct/x.total*100):0;return `<div><div class="topic-history"><b>${t.icon} ${escapeHTML(t.name)}</b><span>${x.total?`${x.correct}/${x.total}問 (${rate}%)`:'まだ解いていません'}</span></div><div class="progress-outer small-progress"><div class="progress-inner" style="width:${rate}%"></div></div></div>`;}).join('')}</div></section><section class="panel history-panel"><div class="panel-title-row"><h3 class="panel-title">最近の学習</h3><span class="muted">最大30回</span></div>${data.history.length?`<div class="history-rows">${data.history.map(h=>`<div class="history-row"><div><b>${escapeHTML(LABELS[h.mode]||'クイズ')} • ${Math.max(0,h.total)}問</b><small>${escapeHTML(formatDate(h.date))} / ${h.topics.length}分野</small></div><div class="history-score">${Math.round(h.accuracy)}%</div></div>`).join('')}</div>`:'<p class="empty-state">学習履歴はありません。まずは数問解いてみましょう。</p>'}</section><div class="side-actions"><button class="secondary-button" type="button" data-action="export">履歴をCSVで保存</button><button class="secondary-button" type="button" data-action="reset-stats">学習記録を削除</button></div><p class="hint-line">記録はこの端末のブラウザ内のみ。CSV出力・印刷したファイルの扱いは学校のルールに従ってください。</p></div>`;
  }
  function formatDate(d){const date=new Date(d);return Number.isFinite(date.getTime())?date.toLocaleString('ja-JP'):'不明';}
  function exportCSV(){const lines=[['日付','難易度','分野数','問題数','正解数','正答率(%)'],...data.history.map(h=>[formatDate(h.date),LABELS[h.mode]||'クイズ',h.topics.length,h.total,h.correct,h.accuracy])];const cell=x=>'"'+String(x).replace(/"/g,'""')+'"';const contents='\ufeff'+lines.map(row=>row.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([contents],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='中3物理_学習履歴.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
  function exitQuestion(){if(!session.length){home();return;}if(index<session.length-1||!answered){if(!window.confirm('学習を中断して設定画面に戻りますか？ 端末に保存できる場合は「続きから再開」で戻れます。'))return;}saveDraft();home();window.scrollTo(0,0);}
  document.addEventListener('click',event=>{
    const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;
    const act=btn.dataset.action;
    switch(act){
      case 'topic':{const id=btn.dataset.topic;if(settings.topics.has(id))settings.topics.delete(id);else settings.topics.add(id);home();break;}
      case 'all':settings.topics=new Set(C.TOPICS.map(x=>x.id));home();break;
      case 'none':settings.topics.clear();home();break;
      case 'difficulty':settings.difficulty=btn.dataset.difficulty;home();break;
      case 'count-chip':setCount(btn.dataset.count);break;
      case 'increment':setCount(settings.count+1);break;
      case 'decrement':setCount(settings.count-1);break;
      case 'start':begin();break;
      case 'review':begin(true);break;
      case 'review-current':begin(true,weakCurrent);break;
      case 'resume':resume();break;
      case 'option':selectOption(Number(btn.dataset.option));break;
      case 'submit':submit();break;
      case 'hint':{showHint=!showHint;btn.setAttribute('aria-expanded',String(showHint));btn.textContent=showHint?'ヒントを閉じる':'💡 ヒントを見る';const hint=$('hintText');if(hint)hint.hidden=!showHint;saveDraft();break;}
      case 'next':next();break;
      case 'exit':exitQuestion();break;
      case 'home':home();window.scrollTo(0,0);break;
      case 'retry':begin(reviewMode);break;
      case 'history':history();break;
      case 'export':exportCSV();break;
      case 'print':window.print();break;
      case 'reset-stats':if(window.confirm('この端末に保存した学習履歴・復習候補をすべて削除しますか？ この操作は元に戻せません。')){data={...DEFAULT,sound:data.sound};save();history();}break;
    }
  });
  document.addEventListener('change',event=>{const e=event.target;if(e.id==='countInput'){settings.count=Math.max(1,Math.min(200,parseInt(e.value,10)||1));home();}else if(e.id==='extendedToggle'){settings.includeExtended=e.checked;}});
  document.addEventListener('input',event=>{if(event.target.id==='numericAnswer'){pendingNumber=event.target.value;saveDraft();}});
  document.addEventListener('keydown',event=>{
    if(event.target.id==='numericAnswer'&&event.key==='Enter'){event.preventDefault();submit();return;}
    if(event.target.tagName==='INPUT'||event.target.tagName==='BUTTON')return;
    if(!session.length||!document.querySelector('.question-card'))return;
    if(!answered&&/^[1-4]$/.test(event.key)&&session[index].kind!=='number'){event.preventDefault();selectOption(Number(event.key)-1);}
    if(event.key==='Enter'){event.preventDefault();answered?next():submit();}
  });
  $('brandHome').addEventListener('click',()=>{document.querySelector('.question-card')?exitQuestion():home();});
  $('soundToggle').addEventListener('click',()=>{data.sound=!data.sound;save();sound(true);});
  updateSound();home();
})();
</script>
</body>
</html>
